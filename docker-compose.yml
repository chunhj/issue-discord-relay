services:
  postgres:
    image: postgres:17   # same literal as IntegrationTestBase.POSTGRES_IMAGE
    restart: unless-stopped
    environment:
      POSTGRES_DB: webhook
      POSTGRES_USER: ${DB_USERNAME:-webhook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-webhook}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"   # local only (T-01-05); host port movable, loopback fixed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # T-04-06

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"   # the only port open to the outside; Spring serves the screen
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/webhook   # address inside the compose network
      DB_USERNAME: ${DB_USERNAME:-webhook}
      DB_PASSWORD: ${DB_PASSWORD:-webhook}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set it in .env (see .env.example)}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?set it in .env (see .env.example)}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
